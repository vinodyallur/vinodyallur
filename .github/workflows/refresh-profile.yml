name: Refresh gh-ascii card

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-gh-ascii-card
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download fresh card data
        env:
          HANDLE: vinodyallur
          GH_ASCII_URL: https://gh.crafter.run
        run: |
          refresh="$(date +%s)"
          curl -fsSL --retry 3 --retry-delay 5 \
            "$GH_ASCII_URL/$HANDLE?theme=dark&refresh=$refresh" \
            -o /tmp/dark_mode.svg
          curl -fsSL --retry 3 --retry-delay 5 \
            "$GH_ASCII_URL/$HANDLE?theme=light&refresh=$refresh" \
            -o /tmp/light_mode.svg

      - name: Merge data without changing the portrait
        run: |
          python scripts/merge_card_data.py dark_mode.svg /tmp/dark_mode.svg --minimum-repos 24 --minimum-contributions 256
          python scripts/merge_card_data.py light_mode.svg /tmp/light_mode.svg --minimum-repos 24 --minimum-contributions 256

      - name: Animate both themes
        run: python scripts/animate_card.py dark_mode.svg light_mode.svg

      - name: Commit only if the card changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dark_mode.svg light_mode.svg
          if git diff --cached --quiet; then
            echo "Card unchanged; nothing to commit."
          else
            git commit -m "chore: refresh gh-ascii card"
            git push
          fi