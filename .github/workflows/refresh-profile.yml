name: Refresh gh-ascii card

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-gh-ascii-card
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download both themes
        env:
          HANDLE: vinodyallur
          GH_ASCII_URL: https://gh.crafter.run
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          avatar_url="$(gh api "users/$HANDLE" --jq '.avatar_url')"
          curl -fsSL --retry 3 --retry-delay 5 \
            "${avatar_url}&cache=$(date +%s)" \
            -o /tmp/github-avatar.jpg
          curl -fsSL --retry 3 --retry-delay 5 \
            -F "image=@/tmp/github-avatar.jpg" \
            -F "theme=dark" \
            "$GH_ASCII_URL/$HANDLE" \
            -o dark_mode.svg
          curl -fsSL --retry 3 --retry-delay 5 \
            -F "image=@/tmp/github-avatar.jpg" \
            -F "theme=light" \
            "$GH_ASCII_URL/$HANDLE" \
            -o light_mode.svg

      - name: Animate both themes
        run: python scripts/animate_card.py dark_mode.svg light_mode.svg

      - name: Commit only if the card changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dark_mode.svg light_mode.svg
          if git diff --cached --quiet; then
            echo "Card unchanged; nothing to commit."
          else
            git commit -m "chore: refresh gh-ascii card"
            git push
          fi